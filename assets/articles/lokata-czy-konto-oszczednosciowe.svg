<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Lokata czy konto oszczędnościowe</title>
  <desc id="desc">Ilustracja porównująca lokatę bankową z kontem oszczędnościowym na wadze szalkowej.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fffbeb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  
  <!-- Left panel: Lokata (Locked/Fixed term) -->
  <rect x="124" y="130" width="420" height="320" rx="32" fill="#ffffff" stroke="#fef3c7" stroke-width="2"/>
  <!-- Lock / Padlock icon -->
  <rect x="254" y="230" width="160" height="130" rx="20" fill="#d97706"/>
  <path d="M284 230v-40c0-30 20-50 50-50s50 20 50 50v40" fill="none" stroke="#d97706" stroke-width="24" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="334" cy="280" r="14" fill="#ffffff"/>
  <path d="M334 290l8 24h-16z" fill="#ffffff"/>
  <!-- Floating label -->
  <rect x="234" y="380" width="200" height="40" rx="10" fill="#fef3c7"/>
  <text x="334" y="408" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">LOKATA (ZAMROŻONA)</text>
  
  <!-- Right panel: Konto oszczędnościowe (Flexible/Savings account) -->
  <rect x="620" y="130" width="460" height="320" rx="32" fill="#ffffff" stroke="#fef3c7" stroke-width="2"/>
  <!-- Wallet with coins -->
  <rect x="740" y="210" width="220" height="150" rx="24" fill="#0284c7"/>
  <path d="M740 240h220v30H740z" fill="#0369a1"/>
  <!-- Wallet clasp -->
  <rect x="910" y="260" width="50" height="40" rx="10" fill="#eab308"/>
  <circle cx="930" cy="280" r="6" fill="#ffffff"/>
  <!-- Coins jumping out -->
  <circle cx="790" cy="170" r="16" fill="#f59e0b"/>
  <circle cx="790" cy="170" r="11" fill="#fbbf24"/>
  <circle cx="850" cy="150" r="20" fill="#f59e0b"/>
  <circle cx="850" cy="150" r="14" fill="#fbbf24"/>
  <!-- Floating label -->
  <rect x="730" y="380" width="240" height="40" rx="10" fill="#e0f2fe"/>
  <text x="850" y="408" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0369a1" text-anchor="middle">KONTO (ELASTYCZNE)</text>

  <!-- Bottom banner -->
  <rect x="120" y="490" width="960" height="90" rx="28" fill="#10233f"/>
  <text x="212" y="548" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Porównanie zysków, dostępności środków i warunków lokat</text>
</svg>
